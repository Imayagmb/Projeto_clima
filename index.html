<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aplicativo de previsão do tempo com temas automáticos e fundo dinâmico">
    <title>Previsão do Tempo</title>

    <!-- Weather Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.12/css/weather-icons.min.css">

    <link rel="icon" type="image/svg+xml" href="./assets/img/favicon.svg" />
    <!-- Estilos -->
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
    <div class="fundo-dinamico" id="fundoDinamico"></div>

    <main class="container">
        <header class="cabecalho">
            <h1 class="titulo">
                <i class="wi wi-day-sunny icone-titulo"></i>
                Previsão do Tempo
            </h1>
            <button class="botao-tema" id="botaoTema" aria-label="Alternar tema">
                <i class="wi wi-day-sunny icone-tema"></i>
            </button>
        </header>

        <section class="secao-busca">
            <div class="container-busca">
                <div class="autocomplete-wrapper">
                    <input type="text" id="campoCidade" class="input-busca" placeholder="Digite o nome da cidade ..."
                        autocomplete="off" aria-label="Nome da cidade">
                    <div class="autocomplete-suggestions" id="autocompleteSugestoes"></div>
                </div>
                <button class="botao-busca" id="botaoBusca" aria-label="Buscar">
                    <i class="wi wi-day-sunny"></i>
                </button>
            </div>
        </section>

        <div class="indicador-carregamento oculto" id="indicadorCarregamento">
            <div class="spinner"></div>
            <p>Buscando informações...</p>
        </div>

        <div class="area-erro oculto" id="areaErro">
            <i class="wi wi-cloud-down"></i>
            <p class="mensagem-erro" id="mensagemErro"></p>
            <button class="botao-tentar-novamente oculto" id="botaoTentarNovamente">
                Tentar Novamente
            </button>
        </div>

        <section class="area-resultados oculto" id="areaResultados">
            <div class="cartao-clima">

                <!-- Localização -->
                <div class="localizacao">
                    <i class="wi wi-location-arrow"></i>
                    <h2 id="nomeCidade"></h2>
                </div>

                <!-- Temperatura principal + ícone -->
                <div class="clima-principal">
                    <i class="icone-clima" id="iconeClima"></i>
                    <div class="temperatura-principal">
                        <span class="temperatura" id="temperatura"></span>
                        <span class="unidade">°C</span>
                    </div>
                </div>

                <p class="descricao-clima" id="descricaoClima"></p>

                <!-- Máx / Mín do dia -->
                <div class="temperaturas-dia">
                    <div class="temp-max">
                        <i class="wi wi-thermometer"></i>
                        <span>Máx: <strong id="tempMaxDia">--</strong>°C</span>
                    </div>
                    <div class="temp-min">
                        <i class="wi wi-thermometer"></i>
                        <span>Mín: <strong id="tempMinDia">--</strong>°C</span>
                    </div>
                </div>

                <!-- Detalhes linha 1: Vento · Umidade · Sensação -->
                <div class="detalhes-clima">
                    <div class="detalhe-item">
                        <i class="wi wi-strong-wind"></i>
                        <div class="detalhe-conteudo">
                            <span class="detalhe-label">Vento</span>
                            <span class="detalhe-valor" id="velocidadeVento"></span>
                        </div>
                    </div>
                    <div class="detalhe-item">
                        <i class="wi wi-humidity"></i>
                        <div class="detalhe-conteudo">
                            <span class="detalhe-label">Umidade</span>
                            <span class="detalhe-valor" id="umidade"></span>
                        </div>
                    </div>
                    <div class="detalhe-item">
                        <i class="wi wi-thermometer"></i>
                        <div class="detalhe-conteudo">
                            <span class="detalhe-label">Sensação</span>
                            <span class="detalhe-valor" id="sensacaoTermica"></span>
                        </div>
                    </div>
                </div>

                <!-- Detalhes linha 2: Chuva · Nascer · Pôr · UV -->
                <div class="detalhes-clima detalhes-extras">
                    <div class="detalhe-item">
                        <i class="wi wi-umbrella"></i>
                        <div class="detalhe-conteudo">
                            <span class="detalhe-label">Chuva</span>
                            <span class="detalhe-valor" id="probabilidadeChuva"></span>
                        </div>
                    </div>
                    <div class="detalhe-item">
                        <i class="wi wi-sunrise"></i>
                        <div class="detalhe-conteudo">
                            <span class="detalhe-label">Nascer</span>
                            <span class="detalhe-valor" id="nascerSol"></span>
                        </div>
                    </div>
                    <div class="detalhe-item">
                        <i class="wi wi-sunset"></i>
                        <div class="detalhe-conteudo">
                            <span class="detalhe-label">Pôr do sol</span>
                            <span class="detalhe-valor" id="porSol"></span>
                        </div>
                    </div>
                    <div class="detalhe-item detalhe-uv">
                        <i class="wi wi-day-sunny"></i>
                        <div class="detalhe-conteudo">
                            <span class="detalhe-label">Índice UV</span>
                            <span class="detalhe-valor" id="indiceUV"></span>
                            <span class="uv-nivel" id="indiceUVNivel"></span>
                        </div>
                    </div>
                </div>

                <!-- Data e hora -->
                <div class="data-hora-wrapper">
                    <div class="data-hora">
                        <i class="wi wi-time-3"></i>
                        <span id="dataHora"></span>
                    </div>
                </div>
            </div>

            <!-- Previsão 7 dias -->
            <div class="previsao-semanal oculto" id="previsaoSemanal">
                <h3 class="previsao-titulo">
                    <i class="wi wi-cloudy"></i>
                    PRÓXIMOS 7 DIAS
                </h3>
                <div class="previsao-lista" id="previsaoLista"></div>
            </div>
        </section>

        <footer class="rodape">
            <p>Dados fornecidos por Open-Meteo</p>
        </footer>
    </main>

    <script src="./assets/js/api.js"></script>
</body>

</html>
